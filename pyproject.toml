[project]
name = "analyst-workbench-backend"
version = "0.1.0"
description = "Analyst AI workbench backend (Multica wave-0 scaffold)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tenacity>=8.3",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["frontmatter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# CI guard: engine MUST NOT import storage implementations,
# only the protocol module. See agent-interface.md §11.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "engine -> storage seam"
type = "forbidden"
source_modules = ["app.agent_engine"]
forbidden_modules = ["app.storage"]
ignore_imports = ["app.agent_engine.* -> app.storage.protocol"]
